# Production stack: `docker compose up -d --build`, then open http://localhost:${WEB_PORT:-3000}
name: qa-mail-manager

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-qa_mail_manager}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published: only the backend talks to the database

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: QA Mail Manager
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-qa_mail_manager}
      MAILTM_BASE_URL: ${MAILTM_BASE_URL:-https://api.mail.tm}
      INBOX_SYNC_INTERVAL: ${INBOX_SYNC_INTERVAL:-2m}
      TZ: ${TZ:-Asia/Jakarta}
    # Not published: reached through the frontend's nginx at /api, /health and /docs

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres-data:
