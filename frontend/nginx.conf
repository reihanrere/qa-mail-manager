server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Live updates (server-sent events): never buffer, keep the stream open
    location = /api/events {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Backend API, health check and Swagger docs share this origin, so no CORS setup is needed
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Inbox search can scan several Mail.tm pages
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8080;
    }

    location /docs {
        proxy_pass http://backend:8080;
    }

    # Vite emits content-hashed file names, so these can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/inbox, /accounts, ...) all load the SPA
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
