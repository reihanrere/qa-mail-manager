openapi: 3.0.3
info:
  title: QA Mail Manager API
  description: >
    Internal backend that proxies Mail.tm accounts and inboxes for QA/testing purposes.
    The frontend never receives a Mail.tm password or JWT.
  version: '1.0.0'
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Accounts
  - name: Inbox

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/settings:
    get:
      tags: [Settings]
      summary: Read-only runtime configuration
      description: >
        Providers with their current domain and availability, label limits and inbox options.
        Values come from environment variables (see .env.example); the UI uses them instead of
        hard-coded copies.
      responses:
        '200':
          description: Current settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/AppSettings'

    patch:
      tags: [Settings]
      summary: Change editable settings (PATCH /api/settings)
      description: >
        `values` sets keys (same names as `editable` in GET /api/settings), `reset` returns keys
        to their environment defaults. The whole result is validated before anything is saved;
        changes apply immediately and survive restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                values:
                  type: object
                  additionalProperties: true
                  example: { tagMaxLength: 80, messageRetention: "168h", defaultProvider: "local" }
                reset:
                  type: array
                  items:
                    type: string
                  example: [usernameFirstNames]
      responses:
        '200':
          description: Updated settings (same shape as GET)
        '400':
          description: Unknown key or invalid value

  /api/ingest:
    post:
      tags: [Ingest]
      summary: Store a raw email for a local-provider account
      description: >
        Served only on the ingest server (INGEST_PORT, default 8081), not on the main API port.
        Called by the Cloudflare Email Worker through the tunnel. Disabled when INGEST_SECRET is empty.
      parameters:
        - in: header
          name: X-Ingest-Secret
          required: true
          schema:
            type: string
        - in: header
          name: X-Envelope-To
          required: false
          description: SMTP recipient reported by Cloudflare; preferred over the To/Cc headers
          schema:
            type: string
      requestBody:
        required: true
        content:
          message/rfc822:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Stored
        '200':
          description: Duplicate Message-ID for this account; nothing stored
        '400':
          description: Empty body
        '401':
          description: Missing or wrong secret
        '404':
          description: No local account for the recipient (the Worker rejects the email)
        '413':
          description: Larger than INGEST_MAX_BYTES
        '422':
          description: Not a parseable email

  /api/accounts/generate:
    post:
      tags: [Accounts]
      summary: Generate a new mailbox account and save it
      description: >
        Picks a domain on the requested provider (default from MAIL_PROVIDER), generates a
        human-looking username (e.g. rinda.saputra91) and a random password, registers the
        mailbox (Mail.tm only; the local catch-all needs no registration), and persists it to
        PostgreSQL. The optional tag, note and provider are validated before anything is created.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
                properties:
                  data:
                    $ref: '#/components/schemas/MailAccount'
        '400':
          description: Invalid body, tag/note too long, or unknown provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Provider request failed (e.g. Mail.tm down or CATCHALL_DOMAIN not set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts:
    get:
      tags: [Accounts]
      summary: List stored accounts (paginated)
      parameters:
        - name: search
          in: query
          description: Case-insensitive match on email, domain, tag or note
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, USED, BLOCKED]
        - name: provider
          in: query
          schema:
            type: string
            enum: [mailtm, local]
        - name: legacy
          in: query
          description: Only accounts whose address matches LEGACY_USERNAME_PATTERN (old, detectable naming)
          schema:
            type: boolean
        - name: sort
          in: query
          description: >
            `newest` (default) orders by creation date. `latest_message` puts accounts with the most
            recent inbox activity first (refreshed by the background inbox sync).
          schema:
            type: string
            enum: [newest, latest_message]
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: One page of accounts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MailAccount'
                      meta:
                        $ref: '#/components/schemas/PageMeta'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/stats:
    get:
      tags: [Accounts]
      summary: Account counts per status and per domain
      responses:
        '200':
          description: Aggregated counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccountStats'

  /api/accounts/{id}/status:
    patch:
      tags: [Accounts]
      summary: Update an account's status
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid id, body, or status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get a single account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MailAccount'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Accounts]
      summary: Edit an account's tag and/or note
      description: Omitted fields are left unchanged; an empty string clears the value.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAccountRequest'
      responses:
        '200':
          description: The updated account
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MailAccount'
        '400':
          description: Invalid body, nothing to update, or tag/note too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Accounts]
      summary: Delete an account (database only, Mail.tm side untouched)
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/{id}/messages:
    get:
      tags: [Inbox]
      summary: List messages in the account's inbox, newest first
      description: >
        Logs into Mail.tm on demand; the JWT is never persisted. Pages hold up to 30 messages
        (Mail.tm's page size). Mail.tm has no search API, so `search` scans up to 10 pages (300 messages)
        and returns every match in a single page; `meta.truncated` is true when the scan stopped early.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/Page'
        - name: search
          in: query
          description: Case-insensitive match on subject, intro, sender name or address
          schema:
            type: string
      responses:
        '200':
          description: One page of messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MessageSummary'
                      meta:
                        allOf:
                          - $ref: '#/components/schemas/PageMeta'
                          - type: object
                            properties:
                              truncated:
                                type: boolean
        '400':
          description: Invalid account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Mail.tm request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/{id}/messages/{messageId}:
    get:
      tags: [Inbox]
      summary: Get a single message's full detail
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageDetail'
        '400':
          description: Invalid account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Mail.tm request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Inbox]
      summary: Permanently delete a message on Mail.tm
      description: The account's message count and latest-message time are refreshed afterwards.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Mail.tm request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/{id}/messages/{messageId}/read:
    patch:
      tags: [Inbox]
      summary: Mark a message as read on Mail.tm
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Message marked as read
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          seen:
                            type: boolean
                            example: true
        '400':
          description: Invalid account id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account or message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Mail.tm request failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/accounts/{id}/messages/{messageId}/attachments/{attachmentId}:
    get:
      tags: [Inbox]
      summary: Download an attachment
      description: >
        Images and plain text open in the browser; every other type is sent as a download.
        `download=true` always downloads.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Account, message or attachment not found

  /api/accounts/{id}/messages/{messageId}/source:
    get:
      tags: [Inbox]
      summary: Raw message source (RFC 5322) with all headers
      description: Shown as text/plain; `download=true` saves it as .eml (message/rfc822).
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: messageId
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Raw message
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Account or message not found (or stored before raw sources were kept)

  /api/accounts/{id}/replace:
    post:
      tags: [Accounts]
      summary: Replace an address with a new realistic one
      description: >
        Generates a new address on the same provider with the same tag and note, and marks the
        old account BLOCKED. Meant for legacy (qa_test_*) addresses.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '201':
          description: Replacement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
                properties:
                  data:
                    type: object
                    properties:
                      account:
                        $ref: '#/components/schemas/MailAccount'
                      replacedId:
                        type: string
                        format: uuid
        '404':
          description: Account not found
        '502':
          description: Provider request failed

  /api/events:
    get:
      tags: [Settings]
      summary: Live updates (server-sent events)
      description: >
        Streams `message.created`, `accounts.changed` and `settings.changed` events as
        `event: <type>` / `data: <json>` frames, with a comment heartbeat every
        EVENTS_HEARTBEAT_INTERVAL.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number
      schema:
        type: integer
        default: 1
        minimum: 1
    AccountId:
      name: id
      in: path
      required: true
      description: MailAccount UUID
      schema:
        type: string
        format: uuid

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: string
          nullable: true

    GenerateAccountRequest:
      type: object
      properties:
        tag:
          type: string
          description: At most TAG_MAX_LENGTH characters (default 50)
          example: login-flow
        note:
          type: string
          description: At most NOTE_MAX_LENGTH characters (default 500)
          example: Used for the OTP regression suite
        provider:
          type: string
          enum: [mailtm, local]
          description: Omit to use the server default (MAIL_PROVIDER)

    AppSettings:
      type: object
      properties:
        defaultProvider:
          type: string
          example: local
        providers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                enum: [mailtm, local]
              label:
                type: string
              domain:
                type: string
                example: re-testing.me
              available:
                type: boolean
              error:
                type: string
                description: Why the provider cannot generate accounts right now
        limits:
          type: object
          properties:
            tagMaxLength:
              type: integer
              example: 50
            noteMaxLength:
              type: integer
              example: 500
        inbox:
          type: object
          properties:
            syncInterval:
              type: string
              example: 2m0s
            searchMaxPages:
              type: integer
              example: 10
            messageRetention:
              type: string
              example: 720h0m0s
            ingestEnabled:
              type: boolean

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [AVAILABLE, USED, BLOCKED]

    MailAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [mailtm, local]
        legacyName:
          type: boolean
          description: Address matches LEGACY_USERNAME_PATTERN and should be replaced
        accountId:
          type: string
        email:
          type: string
          format: email
        domain:
          type: string
        status:
          type: string
          enum: [AVAILABLE, USED, BLOCKED]
        tag:
          type: string
        note:
          type: string
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
          description: Newest inbox message time, refreshed by the background sync
        messageCount:
          type: integer
          description: Total messages in the inbox at the last sync
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        hasMore:
          type: boolean

    AccountStats:
      type: object
      properties:
        total:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
          example: { AVAILABLE: 3, USED: 1, BLOCKED: 0 }
        byDomain:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              count:
                type: integer
        byProvider:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
              count:
                type: integer
              messages:
                type: integer
                description: Sum of recorded inbox sizes
        legacy:
          type: integer
          description: Accounts matching LEGACY_USERNAME_PATTERN

    MessageSummary:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        intro:
          type: string
        seen:
          type: boolean
        createdAt:
          type: string
          format: date-time
        from:
          type: object
          properties:
            address:
              type: string
            name:
              type: string

    MessageDetail:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        seen:
          type: boolean
        from:
          type: object
          properties:
            address:
              type: string
            name:
              type: string
        to:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
              name:
                type: string
        text:
          type: string
        html:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              filename:
                type: string
              contentType:
                type: string
              size:
                type: integer
              contentId:
                type: string
                description: Referenced from the HTML body as cid:<contentId>
        createdAt:
          type: string
          format: date-time
